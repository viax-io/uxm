variables:
  CONFIG_BRANCH: &ref master
  NPM_TOKEN: $NEXUS_NPM_TOKEN

include:
  - project: "infra/helm"
    ref: *ref
    file: "/ci/pipelines/common.yml"
  - project: "infra/helm"
    ref: *ref
    file: "/ci/pipelines/npm-package.yml"

test:
  image: "public.ecr.aws/docker/library/node:24.16.0"
  script:
    - "NODE_VERSION=$(node -v) echo \"Node version: $NODE_VERSION\""
    - "NPM_VERSION=$(npm -v) && echo \"NPM version: $NPM_VERSION\""
    - npm config set //nexus.viax.tech/repository/viax-npm/:_auth $NEXUS_NPM_TOKEN
    - npm config set registry https://nexus.viax.tech/repository/viax-npm/
    - npm install
    # Constitution V gates (.claude/memory/constitution.md): lint, typecheck and a
    # full build MUST be green before merge — the pre-commit hook only lints
    # staged files and is bypassable, so this job is the real gate.
    - npm run lint
    - npm run typecheck
    # Registry-vs-CSS state-var drift gate — fails the pipeline if any studio
    # knob default and its shipped SCSS fallback disagree (the dead-fallback
    # class; see .claude/memory/gotchas.md and scripts/check-state-var-drift.mjs).
    - npm run check:drift
    - npm run build
    # Vitest smoke suite (tests/) — behavioural contracts of the floating
    # layers, pickers, sanitizers and the generator; junit report for the MR UI.
    - npm run test:ci
    # Nexus has no audit endpoint, so audit against the public registry. The
    # full report is printed for visibility; only CRITICAL advisories fail the
    # job (the remaining highs are all vite 5 → 8 majors, tracked separately).
    - npm run audit:report || true
    - npm run audit:ci
  artifacts:
    when: always
    reports:
      junit: junit-report.xml

publish:
  image: "public.ecr.aws/docker/library/node:24.16.0"
  script:
    - "NODE_VERSION=$(node -v) echo \"Node version: $NODE_VERSION\""
    - "NPM_VERSION=$(npm -v) && echo \"NPM version: $NPM_VERSION\""
    - npm config set //nexus.viax.tech/repository/viax-npm/:_auth $NEXUS_NPM_TOKEN
    - npm config set //nexus.viax.tech/repository/npm-private/:_auth $NEXUS_NPM_TOKEN
    - npm config set registry https://nexus.viax.tech/repository/viax-npm/
    - npm install
    - npm run build
    - npx semantic-release
