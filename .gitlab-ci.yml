variables:
  CONFIG_BRANCH: &ref master

include:
  - project: "infra/helm"
    ref: *ref
    file: "/ci/pipelines/common.yml"
  - project: "infra/helm"
    ref: *ref
    file: "/ci/pipelines/npm-package.yml"

test:
  image: "registry.gitlab.viax.tech/docker/nodejs:24.16"
  script:
    - "NODE_VERSION=$(node -v) echo \"Node version: $NODE_VERSION\""
    - "NPM_VERSION=$(npm -v) && echo \"NPM version: $NPM_VERSION\""
    - npm config set //nexus.viax.tech/repository/viax-npm/:_auth $NEXUS_NPM_TOKEN
    - npm config set registry https://nexus.viax.tech/repository/viax-npm/
    - npm config set email=gitlab.viax.tech
    - npm install
    - npm run test:ci
    - npm run test:coverage
  coverage: '/All files\s+\|\s+\d+\.\d+\s+\|\s+\d+\.\d+\s+\|\s+\d+\.\d+\s+\|\s+(\d+\.\d+)\s+.*/'
  artifacts:
    when: always
    paths:
      - junit-report.xml
    reports:
      junit: junit-report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

publish:
  image: "registry.gitlab.viax.tech/docker/nodejs:24.16"
  variables:
    # semantic-release/npm checks NPM_TOKEN in verifyConditions and uses it
    # to authenticate against the registry declared in
    # package.json#publishConfig.registry — currently Nexus
    # (nexus.viax.tech/repository/npm-private/) — so the npm token is
    # NEXUS_NPM_TOKEN. GITLAB_TOKEN is independent of the publish target:
    # @semantic-release/gitlab uses it for release notes, and
    # @semantic-release/git for pushing CHANGELOG + tag back to master.
    # CI_JOB_TOKEN covers that within the project's own GitLab.
    NPM_TOKEN: $NEXUS_NPM_TOKEN
    GITLAB_TOKEN: $CI_JOB_TOKEN
  script:
    - "NODE_VERSION=$(node -v) echo \"Node version: $NODE_VERSION\""
    - "NPM_VERSION=$(npm -v) && echo \"NPM version: $NPM_VERSION\""
    - npm config set //nexus.viax.tech/repository/viax-npm/:_auth $NEXUS_NPM_TOKEN
    - npm config set registry https://nexus.viax.tech/repository/viax-npm/
    - npm config set email=gitlab.viax.tech
    - npm install
    - npm run build
    - npx semantic-release
