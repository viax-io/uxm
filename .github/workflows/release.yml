name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.released.outputs.version }}
    permissions:
      contents: write        # @semantic-release/git commit; @semantic-release/github release + tag
      issues: write          # release comments
      pull-requests: write   # ditto, on PRs
      id-token: write        # OIDC trusted publishing to npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # semantic-release needs full history + all tags

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org/

      - run: |
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"

      - run: npm ci

      # master is deliberately unprotected (gotchas.md → Git), so a direct push
      # would otherwise publish unverified code. Re-run the CI gates here: a
      # PR-merged commit passes them in a minute, a stray push is stopped
      # before semantic-release tags and publishes it.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:drift
      - run: npm test

      - run: npm run build

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: released
        run: |
          if [ -f .released-version ]; then
            echo "version=$(cat .released-version)" >> "$GITHUB_OUTPUT"
          fi

      # build:cdn stamps pkg.version into uxm.esm.js's banner comment and
      # cdn-manifest.json, so it must run after semantic-release has bumped
      # package.json — not alongside the earlier `npm run build`.
      - if: steps.released.outputs.version != ''
        run: npm run build:cdn

      - if: steps.released.outputs.version != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.S3_REGION }}

      # Versioned, immutable path (see scripts/build-cdn.mjs) — never overwritten,
      # so a long max-age is safe.
      - if: steps.released.outputs.version != ''
        run: |
          aws s3 cp dist-cdn/ "s3://${{ vars.S3_BUCKET }}/${{ steps.released.outputs.version }}/" \
            --recursive \
            --cache-control "public, max-age=31536000, immutable"

  notify:
    needs: publish
    if: needs.publish.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.publish.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - env:
          SLACK_NOTIFICATION_URL: ${{ secrets.SLACK_NOTIFICATION_URL }}
        run: node scripts/notify-slack.mjs "${{ needs.publish.outputs.version }}"
