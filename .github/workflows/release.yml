name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.released.outputs.version }}
    permissions:
      contents: write        # @semantic-release/git commit; @semantic-release/github release + tag
      issues: write          # release comments
      pull-requests: write   # ditto, on PRs
      id-token: write        # OIDC trusted publishing to npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # semantic-release needs full history + all tags

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org/

      - run: |
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"

      - run: npm install

      - run: npm run build

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: released
        run: |
          if [ -f .released-version ]; then
            echo "version=$(cat .released-version)" >> "$GITHUB_OUTPUT"
          fi

  notify:
    needs: publish
    if: needs.publish.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.publish.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - env:
          SLACK_NOTIFICATION_URL: ${{ secrets.SLACK_NOTIFICATION_URL }}
        run: node scripts/notify-slack.mjs "${{ needs.publish.outputs.version }}"
