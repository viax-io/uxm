name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org/

      - run: |
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"

      # `npm ci` installs exactly the lockfile (and fails if package.json drifted
      # from it) — the reproducibility a gate needs; `npm install` would resolve.
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run check:drift

      - run: npm run build

      # The CDN bundles have their own gates (gzip budgets, a strict-consumer
      # typecheck of the bundled .d.ts). Run them on the PR: the release job
      # only builds the CDN after semantic-release has published to npm, so a
      # budget overrun found there leaves a version on npm with no CDN files
      # (4.121.0). Built before the tests so the dist-cdn checks in
      # tests/public-api.test.ts run instead of skipping.
      - run: npm run build:cdn

      - run: npm run test:ci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-report
          path: junit-report.xml

      - run: npm run audit:report || true

      - run: npm run audit:ci
