name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org/

      - run: |
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"

      - run: npm install

      # Constitution V gates (.claude/memory/constitution.md): lint, typecheck and a
      # full build MUST be green before merge — the pre-commit hook only lints
      # staged files and is bypassable, so this job is the real gate.
      - run: npm run lint

      - run: npm run typecheck

      # Registry-vs-CSS state-var drift gate — fails the pipeline if any studio
      # knob default and its shipped SCSS fallback disagree (the dead-fallback
      # class; see .claude/memory/gotchas.md and scripts/check-state-var-drift.mjs).
      - run: npm run check:drift

      - run: npm run build

      # No test framework is configured yet — this is an intentional no-op stub.
      - run: npm run test:ci
